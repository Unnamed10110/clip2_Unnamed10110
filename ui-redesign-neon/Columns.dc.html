<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000; }
    a { color: #00ff66; } a:hover { color: #00c850; }
    .win {
      box-sizing: border-box; height: 520px; background: #000;
      box-shadow: inset 0 0 0 1px #00c850;
      display: flex; flex-direction: column; overflow: hidden;
      font-family: Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
      font-size: 13px; line-height: 1;
    }
    .search { flex: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 11px; }
    .rule { flex: 0 0 auto; height: 1px; background: #004b17; }
    .cols { flex: 1 1 auto; display: flex; gap: 8px; padding: 4px 8px 0; overflow: hidden; }
    .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
    .row { flex: 0 0 auto; height: 26px; display: flex; align-items: center; border-radius: 3px; }
    .on { background: #00ff66; }
    .c-mark { flex: 0 0 10px; color: #00ff66; font-size: 11px; }
    .c-idx  { flex: 0 0 26px; text-align: right; padding-right: 7px; color: #00963c; font-size: 12px; }
    .c-typ  { flex: 0 0 26px; color: #008028; font-size: 9px; letter-spacing: 0.5px; }
    .c-con  { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #00ff66; font-size: 12px; }
    .c-age  { flex: 0 0 34px; text-align: right; padding-right: 4px; color: #008028; font-size: 10px; }
    .on .c-mark, .on .c-idx, .on .c-typ, .on .c-age { color: #004b17; }
    .on .c-con { color: #000; }
    .foot {
      flex: 0 0 auto; height: 22px; background: #00260f; display: flex; align-items: center;
      gap: 16px; padding: 0 11px; font-size: 11px; color: #00963c; box-shadow: inset 0 1px 0 #004b17;
    }
    .foot b { color: #00ff66; font-weight: 400; }
  </style>
</helmet>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #000">

  <div class="win" style="width: 320px">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#008028" stroke-width="1.4">
        <circle cx="7" cy="7" r="4.5"></circle>
        <path d="M10.5 10.5 L14 14" stroke-linecap="round"></path>
      </svg>
      <div style="flex: 1 1 auto; color: #005c1c; font-size: 12px">Search pinned</div>
      <div style="font-size: 11px; color: #008028">6</div>
    </div>
    <div class="rule"></div>
    <div class="cols" style="flex-direction: column; gap: 0">
      <sc-for list="{{pinned}}" as="row" hint-placeholder-count="6">
        <div class="row">
          <div class="c-mark">*</div>
          <div class="c-con">{{row.text}}</div>
          <div class="c-age">{{row.age}}</div>
        </div>
      </sc-for>
    </div>
    <div class="foot"><div><b>&#8677;</b> list</div><div><b>&#8629;</b> paste</div></div>
  </div>

  <div class="win" style="width: 640px">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#00963c" stroke-width="1.4">
        <circle cx="7" cy="7" r="4.5"></circle>
        <path d="M10.5 10.5 L14 14" stroke-linecap="round"></path>
      </svg>
      <div style="flex: 1 1 auto; color: #005c1c">Search clipboard</div>
      <div style="font-size: 11px; color: #00963c">All 47</div>
      <div style="font-size: 11px; color: #005c1c; margin-left: 14px">Snippets 12</div>
    </div>
    <div class="rule"></div>

    <!-- Two columns of items: twice the history on screen without shrinking the type. -->
    <div class="cols">
      <div class="col">
        <sc-for list="{{colA}}" as="row" hint-placeholder-count="17">
          <div class="row {{row.cls}}">
            <div class="c-mark">{{row.mark}}</div>
            <div class="c-idx">{{row.idx}}</div>
            <div class="c-typ">{{row.type}}</div>
            <div class="c-con">{{row.text}}</div>
            <div class="c-age">{{row.age}}</div>
          </div>
        </sc-for>
      </div>
      <div class="col">
        <sc-for list="{{colB}}" as="row" hint-placeholder-count="17">
          <div class="row {{row.cls}}">
            <div class="c-mark">{{row.mark}}</div>
            <div class="c-idx">{{row.idx}}</div>
            <div class="c-typ">{{row.type}}</div>
            <div class="c-con">{{row.text}}</div>
            <div class="c-age">{{row.age}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="foot">
      <div><b>&#8629;</b> paste</div>
      <div><b>&#8677;</b> pinned</div>
      <div><b>?</b> shortcuts</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{ "$preview": { "width": 972, "height": 520 } }'>
// Direction: "Columns". 34 items on screen at once, same row height as before.
class Component extends DCLogic {
  renderVals() {
    const SELECTED = 1;
    const data = [
      ['SELECT id, name FROM customers', 'TXT', '2m'],
      ['github.com/Unnamed10110/clip2',  'TXT', '5m'],
      ['ClipboardManager.cpp:6461',      'TXT', '8m', 1],
      ['Screenshot 2026-09-11.png',      'IMG', '12m'],
      ['3 files - history.dat',          'FIL', '18m'],
      ['HookSafeSleep services the hook','TXT', '24m'],
      ['cmake -B build -DCLIP2_TRACE=ON','TXT', '31m'],
      ['RGB(0, 255, 102)',               'TXT', '47m'],
      ['%APPDATA%\\clip2\\history.dat',  'TXT', '1h'],
      ['overlay-dual-pane.png',          'IMG', '1h'],
      ['git rebase -i HEAD~3',           'TXT', '2h'],
      ['Consolas',                       'TXT', '3h'],
      ['LowLevelHooksTimeout',           'TXT', '3h'],
      ['HKCU\\Software\\clip2',          'TXT', '4h', 1],
      ['clip2.exe',                      'FIL', '5h'],
      ['AddClipboardFormatListener',     'TXT', '6h'],
      ['ico2.ico',                       'IMG', '1d'],
      ['Ctrl+Shift+F11',                 'TXT', '1d', 1],
      ['SetWindowsHookEx returned null', 'TXT', '1d'],
      ['build.bat trace',                'TXT', '2d'],
      ['kThemePresets',                  'TXT', '2d'],
      ['THEME_NEON_GREEN',               'TXT', '2d'],
      ['blobs\\a3f9c1.dat',              'FIL', '3d'],
      ['GetClipboardSequenceNumber',     'TXT', '3d'],
      ['ico2-256.png',                   'IMG', '3d'],
      ['EM_SETCUEBANNER',                'TXT', '4d'],
      ['WM_CLIPBOARDUPDATE',             'TXT', '4d'],
      ['DrawTypeGlyph',                  'TXT', '5d'],
      ['clip2.slnx',                     'FIL', '5d'],
      ['PINNED_WIDTH = 320',             'TXT', '6d'],
      ['OVERLAY_CONTENT_TOP',            'TXT', '6d'],
      ['RowTopForVisible',               'TXT', '1w'],
      ['release_github.ps1',             'FIL', '1w'],
      ['app.manifest',                   'FIL', '1w']
    ];
    const mk = (d, i) => ({
      idx: String(i + 1), text: d[0], type: d[1], age: d[2],
      mark: d[3] ? '*' : '', cls: i === SELECTED ? 'on' : ''
    });
    const all = data.map(mk);
    return {
      colA: all.slice(0, 17),
      colB: all.slice(17, 34),
      pinned: [
        { text: 'ClipboardManager.cpp:6461', age: '8m' },
        { text: 'HKCU\\Software\\clip2',     age: '4h' },
        { text: 'Ctrl+NumPadDot',            age: '4d' },
        { text: 'clip2.exe',                 age: '4d' },
        { text: 'RGB(0, 255, 102)',          age: '1w' },
        { text: 'ico2.ico',                  age: '2w' }
      ]
    };
  }
}
</script>
</body>
</html>
