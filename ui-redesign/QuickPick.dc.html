<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000; }
    a { color: #83bdf8; } a:hover { color: #b6d5f4; }
    .win {
      width: 420px; height: 272px; box-sizing: border-box;
      background: #000; box-shadow: inset 0 0 0 1px #83bdf8;
      display: flex; flex-direction: column; overflow: hidden; padding-top: 9px;
      font-family: Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
      font-size: 13px; line-height: 1;
    }
    .row { flex: 0 0 auto; height: 38px; display: flex; align-items: center; gap: 11px; padding: 0 13px; }
    .key {
      flex: 0 0 21px; text-align: right; font-size: 17px; font-weight: 700; color: #83bdf8;
    }
    .txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b6d5f4; }
    .kind { flex: 0 0 auto; font-size: 9px; letter-spacing: 0.6px; color: #33475c; }
    .on { background: #83bdf8; }
    .on .key { color: #06101c; }
    .on .txt { color: #06101c; }
    .on .kind { color: #2c4a6b; }
    .foot {
      flex: 0 0 auto; margin-top: auto; height: 26px; display: flex; align-items: center;
      gap: 16px; padding: 0 13px; font-size: 10px; color: #46586b;
      box-shadow: inset 0 1px 0 #101b26;
    }
    .foot b { color: #8fa8c0; font-weight: 400; }
  </style>
</helmet>

<!-- Opens at the text caret and closes on Esc or blur: no header, no search, no
     status strip. Press the digit, it pastes. Complements the browser rather
     than replacing it. -->
<div class="win">

  <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
    <div class="row {{row.cls}}">
      <div class="key">{{row.key}}</div>
      <div class="txt">{{row.text}}</div>
      <div class="kind">{{row.kind}}</div>
    </div>
  </sc-for>

  <div class="foot">
    <div><b>1&#8211;6</b> paste</div>
    <div><b>&#8984;.</b> all 47</div>
    <div><b>esc</b> dismiss</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{ "$preview": { "width": 420, "height": 272 } }'>
// Direction: "Quick pick". Smallest possible footprint for the common case --
// grabbing something from the last handful of copies without leaving the caret.
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['SELECT id, name FROM customers WHERE act', ''],
      ['https://github.com/Unnamed10110/clip2', ''],
      ['ClipboardManager.cpp:6461', ''],
      ['Screenshot 2026-09-10 081722.png', 'IMG'],
      ['3 files - history.dat, blobs\\', 'FIL'],
      ['HookSafeSleep keeps the hook serviced', '']
    ];
    return {
      rows: data.map((d, i) => ({
        key: String(i + 1),
        text: d[0],
        kind: d[1],
        cls: i === 0 ? 'on' : ''
      }))
    };
  }
}
</script>
</body>
</html>
