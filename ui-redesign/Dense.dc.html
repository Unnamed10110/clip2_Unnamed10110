<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000; }
    a { color: #83bdf8; } a:hover { color: #b6d5f4; }
    .win {
      width: 640px; height: 560px; box-sizing: border-box;
      background: #000; box-shadow: inset 0 0 0 1px #466c93;
      display: flex; flex-direction: column; overflow: hidden;
      font-family: Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
      font-size: 12px; line-height: 1;
    }
    .search { flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 11px; }
    .rule { flex: 0 0 auto; height: 1px; background: #14222f; }
    .head {
      flex: 0 0 auto; height: 20px; display: flex; align-items: center;
      font-size: 9px; letter-spacing: 1px; color: #33475c;
      box-shadow: inset 0 -1px 0 #101b26;
    }
    .row {
      flex: 0 0 auto; height: 26px; display: flex; align-items: center;
      box-shadow: inset 0 -1px 0 #0a1219;
    }
    .c-pin { flex: 0 0 9px; display: flex; justify-content: center; }
    .c-idx { flex: 0 0 28px; text-align: right; padding-right: 9px; color: #46586b; }
    .c-typ { flex: 0 0 34px; font-size: 9px; letter-spacing: 0.6px; color: #46586b; }
    .c-con { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b6d5f4; }
    .c-whn { flex: 0 0 46px; text-align: right; padding-right: 11px; color: #46586b; }
    .on { background: #83bdf8; }
    .on .c-idx, .on .c-typ, .on .c-whn { color: #2c4a6b; }
    .on .c-con { color: #06101c; }
    .foot {
      flex: 0 0 auto; height: 24px; background: #131c24; display: flex; align-items: center;
      gap: 16px; padding: 0 11px; font-size: 10px; color: #6b7d8f;
    }
    .foot b { color: #b6d5f4; font-weight: 400; }
  </style>
</helmet>

<div class="win">

  <!-- No boxed field, no app-name bar: the query line and a rule, nothing more. -->
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#46586b" stroke-width="1.4">
      <circle cx="7" cy="7" r="4.5"></circle>
      <path d="M10.5 10.5 L14 14" stroke-linecap="round"></path>
    </svg>
    <div style="flex: 1 1 auto; color: #33475c">Filter 47 items</div>
    <div style="font-size: 10px; color: #33475c">ALL</div>
  </div>
  <div class="rule"></div>

  <!-- Real columns. The type code replaces the outlined badge and costs 34px, not 44. -->
  <div class="head">
    <div class="c-pin"></div>
    <div class="c-idx">#</div>
    <div class="c-typ">TYPE</div>
    <div class="c-con">CONTENT</div>
    <div class="c-whn">WHEN</div>
  </div>

  <sc-for list="{{rows}}" as="row" hint-placeholder-count="18">
    <div class="row {{row.cls}}">
      <div class="c-pin">
        <sc-if value="{{row.pinned}}" hint-placeholder-val="{{true}}">
          <div style="width: 3px; height: 3px; border-radius: 50%; background: #83bdf8"></div>
        </sc-if>
      </div>
      <div class="c-idx">{{row.idx}}</div>
      <div class="c-typ">{{row.type}}</div>
      <div class="c-con">{{row.text}}</div>
      <div class="c-whn">{{row.when}}</div>
    </div>
  </sc-for>

  <div class="foot">
    <div><b>&#8629;</b> paste</div>
    <div><b>&#8677;</b> pinned</div>
    <div><b>/</b> filter</div>
    <div><b>?</b> keys</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{ "$preview": { "width": 640, "height": 560 } }'>
// Direction: "Dense". 18 rows where the current design fits 10, at the same window height.
class Component extends DCLogic {
  renderVals() {
    const SELECTED = 3;
    const data = [
      ['SELECT id, name FROM customers WHERE active = 1', 'TXT', '2m'],
      ['https://github.com/Unnamed10110/clip2/releases',  'TXT', '5m'],
      ['ClipboardManager.cpp:6461',                       'TXT', '8m',  1],
      ['Screenshot 2026-09-10 081722.png',                'IMG', '12m'],
      ['3 files - history.dat, blobs\\, settings.reg',     'FIL', '18m'],
      ['HookSafeSleep keeps the low-level hook serviced',  'TXT', '24m'],
      ['cmake -S . -B build -DCLIP2_TRACE=ON',             'TXT', '31m'],
      ['RGB(131, 189, 248)',                               'TXT', '47m'],
      ['%APPDATA%\\clip2\\history.dat',                    'TXT', '1h'],
      ['overlay-dual-pane.png',                            'IMG', '1h'],
      ['git rebase -i HEAD~3',                             'TXT', '2h'],
      ['Consolas',                                         'TXT', '3h'],
      ['LowLevelHooksTimeout',                             'TXT', '3h'],
      ['HKCU\\Software\\clip2',                            'TXT', '4h',  1],
      ['clip2.exe',                                        'FIL', '5h'],
      ['AddClipboardFormatListener failed err=1418',       'TXT', '6h'],
      ['ico2.ico',                                         'IMG', '1d'],
      ['Ctrl+Shift+F11',                                   'TXT', '1d',  1]
    ];
    return {
      rows: data.map((d, i) => ({
        idx: String(i + 1),
        text: d[0],
        type: d[1],
        when: d[2],
        pinned: !!d[3],
        cls: i === SELECTED ? 'on' : ''
      }))
    };
  }
}
</script>
</body>
</html>
