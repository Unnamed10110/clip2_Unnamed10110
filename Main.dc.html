<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000; }
    a { color: #83bdf8; } a:hover { color: #b6d5f4; }
    .clip2-frame {
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      font-family: Consolas, "DejaVu Sans Mono", ui-monospace, monospace;
      font-size: 14px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
    }
    .clip2-row {
      position: absolute;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      padding-left: 10px;
      height: 46px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .clip2-badge {
      flex: 0 0 auto;
      width: 34px;
      height: 22px;
      border-radius: 6px;
      border-width: 1px;
      border-style: solid;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip2-idx { flex: 0 0 auto; width: 28px; margin-left: 10px; }
    .clip2-prev { flex: 1 1 auto; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; }
    .clip2-meta { flex: 0 0 auto; margin-left: 12px; margin-right: 8px; font-size: 12px; }
    .clip2-pinbar { position: absolute; left: 0; top: 4px; width: 3px; height: 38px; }
  </style>
</helmet>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #000; padding: 0">

  <!-- ============ PINNED PANE (left, 320px, inactive) ============ -->
  <div class="clip2-frame" style="width: 320px; height: 600px; background: {{bg}}; box-shadow: inset 0 0 0 1px {{border}}">

    <div style="position: absolute; left: 0; top: 0; right: 0; height: 28px; background: {{accentSoft}}"></div>
    <div style="position: absolute; left: 12px; top: 0; height: 28px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: {{txt}}">clip2</div>
    <div style="position: absolute; right: 12px; top: 0; height: 28px; display: flex; align-items: center; font-size: 12px; color: {{headerCount}}">6 items</div>
    <div style="position: absolute; right: 68px; top: 6px; height: 16px; padding: 0 8px; border-radius: 8px; border: 1px solid {{border}}; box-sizing: border-box; display: flex; align-items: center; font-size: 12px; color: {{txt}}">PINNED</div>

    <div style="position: absolute; left: 6px; top: 30px; width: 308px; height: 26px; border-radius: 6px; border: 1px solid {{dividerCol}}; box-sizing: border-box"></div>

    <sc-for list="{{pinnedRows}}" as="row" hint-placeholder-count="6">
      <div class="clip2-row" style="left: 6px; top: {{row.top}}px; width: 305px; background: {{row.fill}}">
        <sc-if value="{{row.pinned}}" hint-placeholder-val="{{true}}">
          <div class="clip2-pinbar" style="background: {{row.fg}}"></div>
        </sc-if>
        <div class="clip2-badge" style="border-color: {{row.badgeBorder}}; color: {{row.meta}}">{{row.badge}}</div>
        <div class="clip2-idx" style="color: {{row.meta}}">{{row.idx}}</div>
        <div class="clip2-prev" style="color: {{row.fg}}">{{row.preview}}</div>
        <div class="clip2-meta" style="color: {{row.meta}}">{{row.info}}</div>
      </div>
    </sc-for>

    <div style="position: absolute; left: 0; bottom: 0; right: 0; height: 24px; background: {{accentSoft}}; box-shadow: inset 0 1px 0 {{dividerCol}}"></div>
    <div style="position: absolute; left: 12px; bottom: 0; height: 24px; display: flex; align-items: center; font-size: 12px; color: {{footHint}}; white-space: nowrap; overflow: hidden">Tab &#8594; main &#160;&#8226;&#160; Enter paste &#160;&#8226;&#160; Esc</div>
  </div>

  <!-- ============ MAIN LIST (600px, active) ============ -->
  <div class="clip2-frame" style="width: 600px; height: 600px; background: {{bg}}; box-shadow: inset 0 0 0 1px {{border}}">

    <div style="position: absolute; left: 0; top: 0; right: 0; height: 28px; background: {{accentSoft}}"></div>
    <div style="position: absolute; left: 12px; top: 0; height: 28px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: {{txt}}">clip2</div>
    <div style="position: absolute; right: 12px; top: 0; height: 28px; display: flex; align-items: center; font-size: 12px; color: {{headerCount}}">47 items</div>
    <div style="position: absolute; right: 80px; top: 6px; height: 16px; padding: 0 8px; border-radius: 8px; border: 1px solid {{border}}; box-sizing: border-box; display: flex; align-items: center; font-size: 12px; color: {{txt}}">CLIPBOARD</div>

    <div style="position: absolute; left: 6px; top: 30px; width: 588px; height: 26px; border-radius: 6px; border: 1px solid {{dividerCol}}; box-sizing: border-box"></div>

    <sc-for list="{{mainRows}}" as="row" hint-placeholder-count="10">
      <div class="clip2-row" style="left: 6px; top: {{row.top}}px; width: 585px; background: {{row.fill}}">
        <sc-if value="{{row.pinned}}" hint-placeholder-val="{{true}}">
          <div class="clip2-pinbar" style="background: {{row.fg}}"></div>
        </sc-if>
        <div class="clip2-badge" style="border-color: {{row.badgeBorder}}; color: {{row.meta}}">{{row.badge}}</div>
        <div class="clip2-idx" style="color: {{row.meta}}">{{row.idx}}</div>
        <div class="clip2-prev" style="color: {{row.fg}}">{{row.preview}}</div>
        <div class="clip2-meta" style="color: {{row.meta}}">{{row.info}}</div>
      </div>
    </sc-for>

    <div style="position: absolute; left: 594px; top: 62px; width: 3px; height: 512px; background: {{dividerCol}}"></div>
    <div style="position: absolute; left: 594px; top: 62px; width: 3px; height: 108px; background: {{border}}"></div>

    <div style="position: absolute; left: 0; bottom: 0; right: 0; height: 24px; background: {{accentSoft}}; box-shadow: inset 0 1px 0 {{dividerCol}}"></div>
    <div style="position: absolute; left: 12px; bottom: 0; height: 24px; display: flex; align-items: center; font-size: 12px; color: {{footHint}}; white-space: nowrap; overflow: hidden">Tab &#8594; pinned &#160;&#8226;&#160; # + Enter &#160;&#8226;&#160; U/M/P/H &#160;&#8226;&#160; M merge &#160;&#8226;&#160; P plain &#160;&#8226;&#160; Z excel &#160;&#8226;&#160; Esc</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "theme": {
    "editor": "enum",
    "default": "Slate",
    "options": ["Slate", "Teal", "Moss", "Ember", "Clay", "Violet", "Graphite", "Neon Green (AS/400)"],
    "section": "Theme"
  },
  "$preview": { "width": 932, "height": 600 }
}'>
// clip2 theme preset preview.
//
// A preset supplies only FOUR colors (see ThemePreset in ClipboardManager.cpp):
// txt, selBg, border, dim. BG and SEL_FG are hardcoded to pure black in
// ApplyThemeId, so every derived tone below is computed the same way the app
// computes it in GetThemeGdi -- that is why this reads as the real overlay.
class Component extends DCLogic {
  renderVals() {
    // txt, selBg, border, dim -- exactly the four fields of a ThemePreset row.
    const PALETTES = {
      'Slate':    { txt: [182,213,244], selBg: [131,189,248], border: [ 70,108,147], dim: [35,58,81] },
      'Teal':     { txt: [167,221,220], selBg: [ 87,204,204], border: [ 39,118,118], dim: [16,64,64] },
      'Moss':     { txt: [187,219,187], selBg: [140,201,142], border: [ 77,116, 78], dim: [39,63,40] },
      'Ember':    { txt: [233,203,171], selBg: [227,171,106], border: [133, 97, 54], dim: [73,51,25] },
      'Clay':     { txt: [243,196,191], selBg: [243,157,149], border: [143, 87, 83], dim: [79,45,43] },
      'Violet':   { txt: [211,203,242], selBg: [188,170,244], border: [108, 96,144], dim: [58,51,79] },
      'Graphite': { txt: [209,209,209], selBg: [183,183,183], border: [105,105,105], dim: [56,56,56] },
      // The current default, for comparison -- note how much hotter it reads.
      'Neon Green (AS/400)': { txt: [0,255,102], selBg: [0,255,102], border: [0,200,80], dim: [0,128,40] }
    };

    const BLACK = [0, 0, 0];
    const p = PALETTES[this.props.theme] ?? PALETTES['Slate'];

    // BlendColor() from ClipboardManager.cpp, integer math and all.
    const blend = (a, b, t) => [0, 1, 2].map((i) =>
      a[i] + Math.trunc((b[i] - a[i]) * t / 255));
    const css = (c) => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

    // Derived tones, matching GetThemeGdi() and the paint routine.
    const accentSoft  = blend(BLACK, p.selBg, 38);   // header / footer / hover wash
    const dividerCol  = blend(BLACK, p.dim, 150);    // separators, scrollbar track
    const metaCol     = blend(BLACK, p.txt, 150);    // row metadata + index
    const headerCount = blend(BLACK, p.txt, 180);    // header item count
    const footHint    = blend(BLACK, p.txt, 170);    // footer hint text

    const SEL_FG = BLACK;  // hardcoded in ApplyThemeId

    // state: 'selected' (active pane fill = selBg, text = SEL_FG),
    //        'hover'    (fill = accentSoft, text stays txt),
    //        'inactive' (selected row on the NON-focused pane: fill = accentSoft),
    //        'normal'
    const mkRow = (i, top, badge, preview, info, state, pinned) => {
      const hotActive = state === 'selected';
      const fill = state === 'selected' ? css(p.selBg)
                 : (state === 'hover' || state === 'inactive') ? css(accentSoft)
                 : 'transparent';
      return {
        top, badge, preview, info, pinned: !!pinned,
        idx: String(i),
        fill,
        fg: hotActive ? css(SEL_FG) : css(p.txt),
        meta: hotActive ? css(SEL_FG) : css(metaCol),
        badgeBorder: hotActive ? css(SEL_FG) : css(p.border)
      };
    };

    // Rows sit at CONTENT_TOP + n*itemHeight + 2 = 62, 112, 162, ... (itemHeight 50).
    const mainRows = [
      mkRow(1,  62, 'T',    'SELECT id, name FROM customers WHERE active = 1', 'Text • now',  'selected'),
      mkRow(2, 112, 'T',    'https://github.com/Unnamed10110/clip2/releases',          'Text • 2m',   'hover'),
      mkRow(3, 162, 'T',    'ClipboardManager.cpp:6461',                               'Text • 5m',   'normal', true),
      mkRow(4, 212, 'IMG',  'Screenshot 2026-09-10 081722.png',                        'Image • 12m', 'normal'),
      mkRow(5, 262, 'FILE', '3 files — history.dat, blobs\\, settings.reg',        'Files • 18m', 'normal'),
      mkRow(6, 312, 'T',    'HookSafeSleep keeps the low-level hook serviced',          'Text • 24m',  'normal'),
      mkRow(7, 362, 'T',    'cmake -S . -B build -DCLIP2_TRACE=ON',                     'Text • 31m',  'normal'),
      mkRow(8, 412, 'IMG',  'overlay-dual-pane.png',                                    'Image • 47m', 'normal'),
      mkRow(9, 462, 'T',    'RGB(131, 189, 248)',                                       'Text • 1h',   'normal'),
      mkRow(10, 512, 'T',   '%APPDATA%\\clip2\\history.dat',                            'Text • 2h',   'normal')
    ];

    // The pinned pane is the NON-focused one here, so its selected row dims to
    // accentSoft and its text stays txt -- the (hot && paneIsActive) branch.
    const pinnedRows = [
      mkRow(1,  62, 'T',    '#83BDF8',                    'Text • 3d',  'inactive', true),
      mkRow(2, 112, 'T',    'Consolas',                   'Text • 4d',  'normal',   true),
      mkRow(3, 162, 'FILE', 'clip2.exe',                  'Files • 4d', 'normal',   true),
      mkRow(4, 212, 'T',    'Ctrl+NumPadDot',             'Text • 6d',  'normal',   true),
      mkRow(5, 262, 'T',    'Software\\clip2',            'Text • 1w',  'normal',   true),
      mkRow(6, 312, 'IMG',  'ico2.ico',                   'Image • 2w', 'normal',   true)
    ];

    return {
      bg: css(BLACK),
      txt: css(p.txt),
      border: css(p.border),
      accentSoft: css(accentSoft),
      dividerCol: css(dividerCol),
      headerCount: css(headerCount),
      footHint: css(footHint),
      mainRows,
      pinnedRows
    };
  }
}
</script>
</body>
</html>
